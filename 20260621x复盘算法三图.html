				let clickTimer = null;  // 在全局变量区加这一行
				
				chart1.on('click', function (params) {
				    if (params.seriesType !== 'candlestick') return;
				    const newtime = params.name;
				
				    if (clickTimer) clearTimeout(clickTimer);
				
				    clickTimer = setTimeout(function() {
				        saveCurrentZoom(); // ← 单击确认前保存
				        symbolx.time = newtime;
						// console.log(newtime)
						$("#testK").val(newtime)
				        loadKlines();
				        clickTimer = null;
				    }, 250);
				});
				
				chart1.on('dblclick', function (params) {
				    if (params.seriesType !== 'candlestick') return;
					
					dblclickOnCandle = true; // 标记本次双击是K线
					    setTimeout(function() { dblclickOnCandle = false; }, 0); // 下一帧重置
				
				    // 取消单击的延迟执行
				    if (clickTimer) {
				        clearTimeout(clickTimer);
				        clickTimer = null;
				    }
				
				    const newtime = params.name;
				
				    // 保存时间到本地
				    for (var i = 0; i < trades.length; i++) {
				        if (trades[i].id == symbolx.id) {
				            trades[i].time = newtime;
				            break;
				        }
				    }
				    setLocal(dataX, trades);
				
				    // 同步更新 symbolx（下次打开以此为中心）
				    symbolx.time = newtime;
				
				    // 更新左边列表显示
				    $(".trade[data-id=" + symbolx.id + "]").find(".xtime").html(newtime);
					 tips("✅ 已保存：" + newtime);
				});
				
				// 双击K线图空白处（非candlestick区域）→ 画水平线
				chart1.getZr().on('dblclick', function(event) {
				    if (!symbolx) return;
				
				    const pointInPixel = [event.offsetX, event.offsetY];
				
				    // 检测是否点在 candlestick 数据点上
				    const pointInGrid = chart1.containPixel('grid', pointInPixel);
				    if (!pointInGrid) return;
				
				    // 把像素坐标转成数据坐标，拿到对应的 xIndex
				    const dataCoord = chart1.convertFromPixel({ seriesIndex: 0 }, pointInPixel);
				    if (!dataCoord) return;
				
				    const xIndex = Math.round(dataCoord[0]);
				    const option = chart1.getOption();
				    const seriesData = option.series[0].data;
				
				    if (xIndex >= 0 && xIndex < seriesData.length) {
				        const bar = seriesData[xIndex]; // [open, close, low, high]
				        const open  = bar[0];
				        const close = bar[1];
				        const low   = bar[2];
				        const high  = bar[3];
				
				        const mouseY = dataCoord[1];
				
				        // 鼠标y值在该K线的最高最低范围内，认为点在K线上，不画线
				        if (mouseY >= low && mouseY <= high) {
				            return;
				        }
				    }
				
				    // 以下是画线逻辑，只有点击在空白处才执行
				    const priceY = dataCoord[1];
				    if (priceY == null || isNaN(priceY)) return;
				
				    for (let i = 0; i < trades.length; i++) {
				        if (trades[i].id == symbolx.id) {
				            if (!trades[i].line) trades[i].line = [];
				            trades[i].line.push(priceY);
				            setLocal(dataX, trades);
				            globeLines = trades[i].line.slice();
				            break;
				        }
				    }
				
				    updateMarkLines();
				    tips('📏 已添加水平线: ' + xNum(priceY));
				});
				
				// 右键点击 markLine → 删除最近的水平线
				chart1.getZr().on('contextmenu', function(event) {
				    if (!symbolx || !globeLines || globeLines.length === 0) return;
				    event.event.preventDefault(); // 阻止浏览器默认右键菜单
				
				    const mouseY = event.offsetY;
				    const threshold = 6; // 像素误差范围
				
				    // 找到距离鼠标y坐标最近的线
				    let closestIdx = -1;
				    let closestDist = Infinity;
				
				    globeLines.forEach((y, idx) => {
				        const p = chart1.convertToPixel({ seriesIndex: 0 }, [0, y]);
				        if (!p) return;
				        const dist = Math.abs(p[1] - mouseY);
				        if (dist < closestDist) {
				            closestDist = dist;
				            closestIdx = idx;
				        }
				    });
				
				    if (closestIdx === -1 || closestDist > threshold) return;
				
				    const removedY = globeLines[closestIdx];
				
				    // 从数据里删除
				    for (let i = 0; i < trades.length; i++) {
				        if (trades[i].id == symbolx.id) {
				            trades[i].line = trades[i].line.filter((_, i) => i !== closestIdx);
				            setLocal(dataX, trades);
				            globeLines = trades[i].line.slice();
				            break;
				        }
				    }
				
				    // 清空所有graphic再重绘
				    chart1.setOption({ graphic: [] }, false);
				    updateMarkLines();
				    tips('🗑 已删除水平线: ' + xNum(removedY));
				});
				
				chart1.getZr().on('click', function (event) {
				    const point = [event.offsetX, event.offsetY];
				
				    globeLines.forEach((y, idx) => {
				        const p = chart1.convertToPixel({ seriesIndex: 0 }, [0, y]);
				        if (!p) return;
				
				        if (Math.abs(p[1] - point[1]) < 5) {
				            globeLines.splice(idx, 1);
				
				            // 同步本地
				            for (let i = 0; i < trades.length; i++) {
				                if (trades[i].id == symbolx.id) {
				                    trades[i].line = globeLines.slice();
				                    setLocal(dataX, trades);
				                    break;
				                }
				            }
				
				            updateMarkLines();
							tips('🗑 已删除水平线: ');
				        }
				    });
				});
				
				chart1.on('dataZoom', function() {
				    updateMarkLines();
				});

			/* ========== 加载 K 线 ========== */
			function loadKlines() {
				 if (!symbolx) return;
				
				    // 加载前保存当前缩放状态
				    saveCurrentZoom();
				    const zoomRange = globeZoom.end - globeZoom.start; // 当前可视范围的百分比宽度
				
				    var targetTime = symbolx.time;
				    startTime = targetTime
				        ? (toTimestamp(transKlineTime(symbolx.time, currentInterval)) - preK * intervalTrans)
				        : (Date.now() - preK * intervalTrans);
				    endTime = targetTime
				        ? (toTimestamp(transKlineTime(symbolx.time, currentInterval)) + afterK * intervalTrans)
				        : Date.now();

				const url = 'https://fapi.binance.com/fapi/v1/klines';
				$.get(url, {
					symbol: symbolx.name,
					interval: currentInterval,
					startTime: startTime,
					endTime: endTime,
					limit: 1000
				}, function(res) {
					globeKlineData=res;
					// console.log(res);
					
					resizeWidth(res);
					
					range={
						start:res[0][0],
						end:res[res.length-1][0]
					}
					
					 // 如果有时间点，计算以时间点为中心的 zoom
					        if (targetTime) {
					            const targetTs = toTimestamp(transKlineTime(symbolx.time, currentInterval));
					            const totalMs  = res[res.length - 1][0] - res[0][0];
					            if (totalMs > 0) {
					                // 时间点在整个数据中的百分比位置
					                const centerPct = (targetTs - res[0][0]) / totalMs * 100;
					                // 以时间点为中心，保持之前的缩放范围
					                const half = zoomRange / 2;
					                globeZoom.start = Math.max(0,   centerPct - half);
					                globeZoom.end   = Math.min(100, centerPct + half);
					                // 边界修正：如果 end 超了就整体左移，start 不够就整体右移
					                if (globeZoom.end === 100) {
					                    globeZoom.start = Math.max(0, 100 - zoomRange);
					                }
					                if (globeZoom.start === 0) {
					                    globeZoom.end = Math.min(100, zoomRange);
					                }
					            }
					        }
					renderChart(res,chart1,symbolx)
					
					
					if ($('#syncBTC').is(':checked')) {
						$.get(url, {
							symbol: "BTCUSDT",
							interval: currentInterval,
							startTime: range.start,
							endTime: range.end,
							limit: 1000
						}, function(res) {
							globeKlineData2 = res;
							resizeWidth(res);
							renderChart(res, chart2);
						});
					} else {
						// 不加载BTC时清空图2
						chart2.clear();
					}
					
					
				});
			}
			
			
			function resizeWidth(res){
				 // ★ 新增：同样根据数据长度调整宽度
				var $chartWrap = $('.chart-wrap');
				let len=res.length;
				if (len < 100&& len>=20) {

				} else if (len < 20 && len>=1){

				}else  {

			}
			
			
			//原始K线数据转化为echartK线数据========================================================
			function rebuildKlineData(data){
				const klineData=data.map(item => {
				    const open = parseFloat(item[1]);
				    const high = parseFloat(item[2]);
					const low = parseFloat(item[3]);
					const close = parseFloat(item[4]);
				    const changePercent = ((close - open) / open * 100).toFixed(2);
					const wavePercent=((high - low) / low * 100).toFixed(2);
				    return {
				        timestamp: item[0],//时间戳
				        open: open,
				        close: close,
				        low: parseFloat(item[3]),
				        high: parseFloat(item[2]),
				        volume: parseFloat(item[5]),
				        quoteVolume: parseFloat(item[7]),
				        color: open > close ? downColor : upColor,
				        changePercent: changePercent,
						wavePercent:wavePercent,
						time:new Date(item[0]).toLocaleString('zh-CN', {
							year: 'numeric',
							month: '2-digit',
							day: '2-digit',
							hour: '2-digit',
							minute: '2-digit',
							second: '2-digit',
							hour12: false
						})
				    };
				});
				return klineData;
			}
			function buildXdata(klineData){
				const category = [];
				klineData.forEach(a => {
					category.push(a.time)
				})
				return category;
			}
			function buildYdata1(klineData){
				 return klineData.map(item => {
				    return [item.open, item.close, item.low, item.high];
				})
			}
			function buildYdata2(klineData){
				return klineData.map((item, index) => {
				    return {
				        // value: item.volume,
						value:item.quoteVolume,
				        itemStyle: {
				            color: item.color
				        }
				    };
				})
			}
			// ★ 新增：成交量（volume，张数）
			function buildYdata3(klineData){
			    return klineData.map((item, index) => {
			        return {
			            value:item.volume,
			            itemStyle: {
			                color: item.color
			            }
			        };
			    })
			}

			//转时间戳
			function toTimestamp(str) {
				// '2022/5/24 18:04:00'
				const [date, time] = str.split(' ')
				const [y, m, d] = date.split('/').map(Number)
				const [hh, mm, ss] = time.split(':').map(Number)
			
				return new Date(y, m - 1, d, hh, mm, ss).getTime()
			}
			//将interval转时间戳
			function intervalToTimestamp(intervalStr) {
			  // 使用正则表达式匹配数字部分和单位部分
			  const match = intervalStr.match(/^(\d+)([mhdwM])$/);
			  
			
			  const value = parseInt(match[1], 10); // 提取数字
			  const unit = match[2]; // 提取单位
			
			  // 根据单位返回对应的毫秒数
			  switch (unit) {
			    case 'm': // 分钟
			      return value * 60 * 1000;
			    case 'h': // 小时
			      return value * 60 * 60 * 1000;
			    case 'd': // 天
			      return value * 24 * 60 * 60 * 1000;
			    case 'w': // 周
			      return value * 7 * 24 * 60 * 60 * 1000;
			    case 'M': // 月 (按30天近似计算)
			      return value * 30 * 24 * 60 * 60 * 1000;
			    default:
			      throw new Error(`不支持的时间单位: "${unit}"`);
			  }
			}
			
			
			// 15m尺度：2024/6/20 08:42:00  ==>  2024/6/20 08:30:00
			function transKlineTime(timeStr, interval) {
			    // 解析输入时间
			    const date = new Date(timeStr.replace(/\//g, '-'));
			    
			    // 期货市场每日从8点开始
			    const MARKET_START_HOUR = 8;
			    
			    // 提取时间组件
			    const year = date.getFullYear();
			    const month = date.getMonth();
			    const day = date.getDate();
			    let hour = date.getHours();
			    let minute = date.getMinutes();
			    let second = date.getSeconds();
			    
			    // 根据interval进行时间对齐
			    switch(interval) {
			        case '1m':
			            // 1分钟线，精确到分钟，秒清零
			            second = 0;
			            break;
			            
			        case '5m':
			            // 5分钟线，分钟数向下取整到5的倍数，秒清零
			            minute = Math.floor(minute / 5) * 5;
			            second = 0;
			            break;
			            
			        case '15m':
			            // 15分钟线，分钟数向下取整到15的倍数，秒清零
			            minute = Math.floor(minute / 15) * 15;
			            second = 0;
			            break;
			            
			        case '30m':
			            // 30分钟线，分钟数向下取整到30的倍数，秒清零
			            minute = Math.floor(minute / 30) * 30;
			            second = 0;
			            break;
			            
			        case '1h':
			            // 1小时线，分钟和秒清零
			            minute = 0;
			            second = 0;
			            break;
						
					case '2h':
					    // 2小时线，对齐到偶数小时，以8点为基准
					    hour = MARKET_START_HOUR + Math.floor((hour - MARKET_START_HOUR) / 2) * 2;
					    minute = 0;
					    second = 0;
					    break;
			            
			        case '4h':
			            // 4小时线，小时数向下取整到4的倍数，分钟和秒清零
			            hour = MARKET_START_HOUR + Math.floor((hour - MARKET_START_HOUR) / 4) * 4;
			            minute = 0;
			            second = 0;
			            break;
					
					case '8h':
					    // 8小时线，以8点为基准，对齐到 8/16/0 点
					    hour = MARKET_START_HOUR + Math.floor((hour - MARKET_START_HOUR) / 8) * 8;
					    minute = 0;
					    second = 0;
					    break;
					
					case '12h':
					    // 12小时线，以8点为基准，对齐到 8/20 点
					    hour = MARKET_START_HOUR + Math.floor((hour - MARKET_START_HOUR) / 12) * 12;
					    minute = 0;
					    second = 0;
					    break;
			            
			        case '1d':
			            // 日线，时间设为8:00:00
			            hour = MARKET_START_HOUR;
			            minute = 0;
			            second = 0;
			            break;
			        
					case '1w':
					            // 周线 - 对齐到本周的起始日（周一）8:00:00
					            // 注意：getDay()返回0(周日)~6(周六)
					            const dayOfWeek = date.getDay(); // 0=周日,1=周一,...,6=周六
					            
					            // 计算到本周一的偏移天数
					            // 如果dayOfWeek=0(周日)，偏移-6天到上周一
					            // 如果dayOfWeek=1(周一)，偏移0天
					            // 如果dayOfWeek>=2，偏移1-dayOfWeek天
					            const daysToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
					            
					            // 创建周一的时间对象
					            const monday = new Date(date);
					            monday.setDate(date.getDate() + daysToMonday);
					            monday.setHours(MARKET_START_HOUR, 0, 0, 0);
					            
					            // 格式化周线时间
					            const formatNumber = (num) => num.toString().padStart(2, '0');
					            return `${monday.getFullYear()}/${formatNumber(monday.getMonth() + 1)}/${formatNumber(monday.getDate())} ${formatNumber(monday.getHours())}:${formatNumber(monday.getMinutes())}:${formatNumber(monday.getSeconds())}`;
					            
					case '1M':
						// 月线 - 对齐到当月第一个交易日的8:00:00
						// 假设每月第一个交易日是1号（可调整）
						const firstDayOfMonth = new Date(year, month, 1, MARKET_START_HOUR, 0, 0);
						
						// 如果需要跳过非交易日（如周末），可以这样处理：
						// const firstWeekday = firstDayOfMonth.getDay(); // 0=周日,1=周一,...,6=周六
						// 如果1号是周末，顺延到下一个周一
						// if (firstWeekday === 0) { // 周日
						//     firstDayOfMonth.setDate(2); // 顺延到2号（周一）
						// } else if (firstWeekday === 6) { // 周六
						//     firstDayOfMonth.setDate(3); // 顺延到3号（下周一）
						// }
						
						// 格式化月线时间
						const formatNumber2 = (num) => num.toString().padStart(2, '0');
						return `${firstDayOfMonth.getFullYear()}/${formatNumber2(firstDayOfMonth.getMonth() + 1)}/${formatNumber2(firstDayOfMonth.getDate())} ${formatNumber2(firstDayOfMonth.getHours())}:${formatNumber2(firstDayOfMonth.getMinutes())}:${formatNumber2(firstDayOfMonth.getSeconds())}`;
					          
			        default:
			            throw new Error(`不支持的K线周期: ${interval}`);
			    }
			    
			    // 创建对齐后的时间对象
			    const alignedDate = new Date(year, month, day, hour, minute, second);
			    
			    // 格式化输出
			    const formatNumber = (num) => num.toString().padStart(2, '0');
				// const formatNumber =(num)=>num;
			    
			    return `${alignedDate.getFullYear()}/${formatNumber(alignedDate.getMonth() + 1)}/${formatNumber(alignedDate.getDate())} ${formatNumber(alignedDate.getHours())}:${formatNumber(alignedDate.getMinutes())}:${formatNumber(alignedDate.getSeconds())}`;
			}
			
			
			
			function formatTransactionTimes(arr) {
			    // 检查输入是否有效
			    if (!Array.isArray(arr)) {
			        throw new Error('输入必须是一个数组');
			    }
			
			    // 使用 map 方法创建新数组，不改变原数组
			    return arr.map(transaction => {
			        // 创建新对象，避免修改原数据
			        const formattedTransaction = { ...transaction };
			        
			        // 处理开始时间
			        if (formattedTransaction.start) {
			            formattedTransaction.start = add0(formattedTransaction.start);
			        }
			        
			        // 处理结束时间
			        if (formattedTransaction.end) {
			            formattedTransaction.end = add0(formattedTransaction.end);
			        }
			        
			        return formattedTransaction;
			    });
			}
			
			function add0(timeStr) {
			    // 解析时间字符串
			    const date = new Date(timeStr.replace(/\//g, '-'));
			    
			    // 检查日期是否有效
			    if (isNaN(date.getTime())) {
			        console.warn(`无效的时间格式: ${timeStr}`);
			        return timeStr; // 返回原字符串
			    }
			    
			    // 提取时间组件并补零
			    const year = date.getFullYear();
			    const month = (date.getMonth() + 1).toString().padStart(2, '0'); // 月份补零
			    const day = date.getDate().toString().padStart(2, '0'); // 日期补零
			    const hours = date.getHours().toString().padStart(2, '0'); // 小时补零
			    const minutes = date.getMinutes().toString().padStart(2, '0'); // 分钟补零
			    const seconds = date.getSeconds().toString().padStart(2, '0'); // 秒钟补零
			    
			    // 返回格式化后的字符串
			    return `${year}/${month}/${day} ${hours}:${minutes}:${seconds}`;
			}

			//保留3位非0数字
			function xNum(numStr) {
			    
			    // 尝试将字符串转换为数字
			    const number = parseFloat(numStr);
			    
			    // 检查转换结果是否为有效数字
			    if (isNaN(number)) {
			       return;
			    }
			    // 判断是否为整数
			    if (Number.isInteger(number)) {
			        return number//.toString();
			    }
			    
			    // 对于小数，保留三位有效数字
			    // 使用toPrecision方法指定有效数字位数[6,7](@ref)
			    let result = number.toPrecision(3);
			    
			    // 移除可能存在的末尾小数点（例如将"123."转换为"123"）
			    if (result.endsWith('.')) {
			        result = result.slice(0, -1);
			    }
			    return result;
			}

			function lineObj(k){

				if(k.close>k.open){
					direction="up";
					part={
						up:k.high-k.close,
						middle:k.close-k.open,
						down:k.open-k.low,

					}
				}else{

						up:k.high-k.open,
						middle:k.open-k.close,
						down:k.close-k.low,
						all:k.high-k.low
					}
				}
				return {
					direction:direction,
					part:part,
					middle_all:(part.middle/part.all).toFixed(2),
					down_up:(part.down/part.up).toFixed(2),
					down_all:(part.down/part.all).toFixed(2),
					up_all:(part.up/part.all).toFixed(2)
				}
			}

			    // A 的合法起始索引：从 pre 开始，到倒数第 2 根结束
			    for (let i = pre; i < pre + num; i++) {

			        // A必须是阳线（上涨K线）======================

			        // A 的成交额必须大于等于 vol2 =========================
			        // if (A.quoteVolume < vol2) continue;
			    			
			        // A 的涨幅必须大于 per=======================
			        const aChange = (A.close - A.open) / A.open;

			        const preKlines = klines.slice(i - pre, i);
					
					// 【新增条件】30m：A的交易量必须 >= 前面20根任意一根的交易量
					if (item == "30m" || item == "15m") {

			        //信号增强： A的收盘价大于前面任意一根的最高价================================

			        // 前面 pre 根中没有阳线，则自动通过此条件==============================
			        let riseFlag = false;

			            if (prev.close > prev.open) {

			        if (hasUpKline && !riseFlag) continue;
			    			
			    
			    	//A 之后的两根K线=================================================

			        const n1Change = (next1.close - next1.open) / next1.open;
			        const n2Change = (next2.close - next2.open) / next2.open;
			    			
			        // 判断两根K线的方向
			        const n1IsUp = n1Change > 0;
			        const n2IsUp = n2Change > 0;
			        
			        if (n1IsUp !== n2IsUp) {
			            // 一涨一跌：每根绝对值分别小于 A涨幅的 1/4
			            if (Math.abs(n1Change) >= aChange / 4) continue;
			            if (Math.abs(n2Change) >= aChange / 4) continue;
			        } else {
			            // 两连涨或两连跌：累计涨跌幅绝对值小于 A涨幅的 1/4
			            const totalChange = Math.abs(n1Change + n2Change);
			            if (totalChange >= aChange / 4) continue;

			        //A 之后的两根K线，每根的高低点范围必须小于 A 范围的 1.2 倍=======================
			        const n1Range = next1.high - next1.low;

			function x_start_mm(symbol, item, arr,num) { //console.log("000000000") 
			
				// alert()
				const testMode=true;
				let testTime=0;
				if($("#testK").length>0){
					testTime=new Date($("#testK").val()).getTime();
				}
				const testText=symbol+" "+testTime+" ";
				
				// 周期自适应参数
				let pre = 50;
				if (item === "5m") pre = 25;
				else if (item === "15m") pre = 10;
				
				// num 为A检测范围，不传入则从arr首位+pre开始检测
				if (num === undefined) {
					// 没有传入 num 参数
					num = arr.length - pre;
				}
				if (!arr || arr.length < pre + num) {
					console.log("x_start_mm数据不足"+symbol+" "+item)
				    return false;
				}
				
				//A之后两根涨幅上限
				const per = 0.01; 
				//A成交量相比pre的倍数
				const Rvol = 8;
				//A涨幅相比after的倍数
				const Rper=4;
				
			    // 只检查最后 num 个成员作为候选 A
				for (let i = arr.length - num; i < arr.length; i++) {
					//增加检测信号
					let plus="";
					let testTarget=false;
					
					
					const A = arr[i];
					
					//定点测试 可忽略
					if(A.timestamp== testTime){
						testTarget=true;
					}
						
					// 条件1：A必须是上涨的 成交额大于10K 涨幅大于0.5% ,上影线不超过整体的0.4倍
					const volA = A.volume;
					const perA = (A.close - A.open) / A.open;
					
					if (A.close <= A.open || A.quoteVolume <10000 || perA<0.008 || lineObj(A).up_all>=0.4) continue;
					
					// // 信号增强：判断 A的收盘价大于pre中所有K线的最高价，如果成立 则添加信号+
					let maxHighInPre = -Infinity;
					for (let k = i - pre; k < i; k++) {
					    if (k < 0) continue;
					    if (arr[k].high > maxHighInPre) {
					        maxHighInPre = arr[k].high;
					    }
					}
					if (A.close >= maxHighInPre){
						plus+="+";
					}
					
					// 信号增强：判断A的涨幅比前面pre根中所有上涨K线的涨幅都大，如果成立 则添加信号+
					let isMaxGain = true;
					for (let k = i - pre; k < i; k++) {
						if (k < 0) continue;
						const prevK = arr[k];
						// 只考虑上涨K线
						if (prevK.close > prevK.open) {
							const prevPer = (prevK.close - prevK.open) / prevK.open;
							if (perA <= prevPer) {
								isMaxGain = false;
								break;
							}
						}
					}
					if (isMaxGain) {
						plus+="+";
					}
			
					// 条件2：成交量倍数逻辑
					let foundM = false;
					let mIndex = -1;
			
					// 从A的前一根开始往前找，找到第一个成交量满足 valA >= 其成交量 * Rvol 的K线作为M
					for (let j = i - 1; j >= i - pre; j--) {
						if (j < 0) break;
						if (volA >= arr[j].volume * Rvol) {
							foundM = true;
							mIndex = j;
							break;
						}
					}
			
					if (!foundM){
						if(testMode && testTarget){
							$(".tips").html(testText+"=========>> 从A的前一根开始往前找，找到第一个成交量满足 valA >= 其成交量 * Rvol 的K线作为M")
						}
						continue;
					}
				
					
					// 新增条件：从M+1 到A（包括A）的所有K线都必须是上涨K线, 并且成交量不大于A的两倍
					let allUp = true;
					for (let k = mIndex+1; k <= i; k++) {
						if (arr[k].close <= arr[k].open || arr[k].volume / volA >=2) {
							allUp = false;
							break;
						}
					}
					
					if (!allUp) {
						if(testMode && testTarget){
							$(".tips").html(testText+"=========>> 从M+1 到A（包括A）的所有K线都必须是上涨K线, 并且成交量不大于A的两倍")
						}
						continue;
					}
			
					// 计算从前面pre根到M之间（不包括M）的所有K线成交量的平均值
					let sumVol = 0;
					let count = 0;
					for (let k = i - pre; k <= mIndex; k++) {
						if (k < 0) continue;
						sumVol += arr[k].volume;
						count++;
					}
			
					// 如果前面pre根全在M之后（理论上不会发生，但防御性处理）
					if (count === 0) continue;
			
					const avgVol = sumVol / count;
			
					// A的成交量必须大于前面pre到M之间每一根的成交量
					let allGreater = true;
					for (let k = i - pre; k < mIndex; k++) {
						if (k < 0) continue;
						if (volA <= arr[k].volume) {
							allGreater = false;
							break;
						}
					}
					if (!allGreater){
						if(testMode && testTarget){
							$(".tips").html(testText+"=========>> A的成交量必须大于前面pre到M之间每一根的成交量")
						}
						continue;
					}
			
					// A的成交量必须是这些K线平均值的Rvol倍以上
					if (volA <= avgVol * Rvol){
						if(testMode && testTarget){
							$(".tips").html(testText+"=========>> A的成交量必须是这些K线平均值的Rvol倍以上")
						}
						continue;
					}
			
					// 条件3：A之后的两根K线
					if (i + 2 >= arr.length) continue;
					const next1 = arr[i + 1];
					const next2 = arr[i + 2];
					
					
					const n1Change = (next1.close - next1.open) / next1.open;
					const n2Change = (next2.close - next2.open) / next2.open;
					
					// perA必须大于后两根分别的涨幅的Rper倍
					if (perA <= Math.abs(n1Change) * Rper) continue;
					if (perA <= Math.abs(n2Change) * Rper) continue;
					
					// 后两根的涨幅分别小于per
					if (Math.abs(n1Change) >= per) continue;
					if (Math.abs(n2Change) >= per) continue;
					
					// 如果后两根同为上涨或同为下跌
					if ((n1Change > 0 && n2Change > 0) || (n1Change < 0 && n2Change < 0)) {
						const perAfter = Math.abs((next1.open - next2.close) / next2.close);
						// perA至少是perAfter的Rper倍, perAfter小于per
						if (perA <= perAfter * Rper || perAfter >= per) continue;
					}
					
					
					// 新增条件：A后两根K线振幅都小于A振幅的0.7
					const waveA = (A.high - A.low) / A.low;
					const n1wave = (next1.high - next1.low) / next1.low;
					const n2wave = (next2.high - next2.low) / next2.low;
					if (n1wave >= waveA * 0.7 || n2wave >= waveA * 0.7) continue;
			
					// ★ 符合条件的，记录到结果集 ★
				   signal_result.push({
					   time: A.time,
					   open: A.open,
					   close: A.close,
					   high: A.high,
					   low: A.low,
					   change: (perA * 100).toFixed(2) + '%',
					   quoteVolume: A.quoteVolume,
					   signal:"s"+plus
				   });
				}
				report(signal_result)
			}
		
			function x_rocket_1m(symbol, item, arr) {

					let condition3 = true;

					let upKlineCount = 0;           // 上涨K线数量计数

			//统计每个小时出现的次数
			function countHours(arr) {
			  // 1. 统计每个小时的出现次数
			  const hourCount = {};
			  
			  for (const item of arr) {
			    const timeStr = item.time;
			    const hour = timeStr.split(':')[0].split(' ')[1]; // 提取小时字符串
			    const hourNum = parseInt(hour, 10);
			    
			    if (isNaN(hourNum)) continue;
			    
			    hourCount[hourNum] = (hourCount[hourNum] || 0) + 1;
			  }
			  
			  // 2. 转换为数组并按次数排序（从多到少）
			  const sortedResult = Object.entries(hourCount)
			    .sort((a, b) => b[1] - a[1])  // 按次数降序排序
			    .map(([hour, count]) => ({
			      count: count,
			      hour: parseInt(hour)
			    }));
			  
			  // 3. 输出格式化结果
			  sortedResult.forEach(item => {
			    console.log(`次数：${item.count}，时刻：${item.hour}点`);
			  });
			  
			  return sortedResult;
			}

				      emphasis: {
				        itemStyle: {
				          // color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
				          //   { offset: 0, color: '#9ec0ff' },
				          //   { offset: 1, color: '#3d5fc7' }
				          // ])
						  color:"#ff0"
				        }
				      },
					  label: {
					        show: true,
					        position: 'top',
					        color: '#ffffff',
					        fontSize: 16,
					        formatter: function(params) {
					          // 如果 chartData 是 [[小时, 次数], ...] 格式
					          return params.data[1];

				    }
				  ]
				};
				
				// 4. 初始化图表（假设你有一个 id 为 'chart' 的 div）
				const chartDom = document.getElementById('chart2');

				  const myChart = echarts.init(chartDom);

				    myChart.resize();
				  });
				}
			}
			
			//"20260715 1250"格式的yyyyMMdd hhmm 时间字符串转成时间戳
			function strToStamp(timeStr) {
			    let year = parseInt(timeStr.substring(0, 4));
			    let month = parseInt(timeStr.substring(4, 6)) - 1; // 月份从0开始
			    let day = parseInt(timeStr.substring(6, 8));
			    let hour = parseInt(timeStr.substring(9, 11));
			    let minute = parseInt(timeStr.substring(11, 13));
			    
			    return new Date(year, month, day, hour, minute).getTime();
			}
			
			function mmddhhmm(timestamp) {
			    const now = new Date(timestamp);
			
			    const month = (now.getMonth() + 1).toString().padStart(2, '0');
			    const date = now.getDate().toString().padStart(2, '0');
			    const hour = now.getHours().toString().padStart(2, '0');
				const minutes = now.getMinutes().toString().padStart(2, '0')
			    return `${month}${date}-${hour}${minutes}`;
			}
		</script>
