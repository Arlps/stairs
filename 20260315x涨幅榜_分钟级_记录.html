			audios.forEach(id => {
				const el = $(id)[0];
				if (!el) return;
				const vol = el.volume;
				el.volume = 0;
				el.play().then(() => {
					el.pause();
					el.currentTime = 0;
					el.volume = vol;
				}).catch(() => {});
			});
			audioUnlocked = true;
			// alert('音频已解锁');
			$("#unlock").removeClass("red").html("已经解锁")

			const total = allSymbols.length;
			const BATCH_SIZE = 10; // 控制并发请求数量

		    const endIndex = Math.min(startIndex + BATCH_SIZE, total);

		            // 获取K线
		            $.ajax({
		                url: 'https://fapi.binance.com/fapi/v1/klines',
		                method: 'GET',
		                data: {
		                    symbol: symbol,
		                    interval: questInterval,//intervalX,
		                    limit: questKnum//limitX // 获取几根K线
		                },
		                dataType: 'json',
		                success: function(klineData) {

							// MutilSignal_1m(klineData,symbol)

							if(Acounter==total && !finished){

								// $("#show2").trigger("click");

								setTimeout(function(){

		                    }
		                }
		            });
		        }, (i % BATCH_SIZE) * DELAY);
		    }
		    
		    // 处理下一批
		    if (endIndex < total) {
		        setTimeout(() => processBatch(endIndex), BATCH_SIZE * DELAY);
		    }
		}

		//检测最新完成的K线是否倍量  样本倒数15到倒数第4
		function isBigVol_1m(klineData){
			var last1=klineData.at(-1);
			const testArr = klineData.slice(-29, -3);
			var flag=true;
			for (var i = 0; i < testArr.length; i++) {
				if(last1[5]<testArr[i][5]*10){

					break;
				}
			}
			return flag;
		}
		
		// 计算最大涨幅的辅助函数（以最后一根完成的K线的收盘价为基准）
		function calculateMaxIncrease (klineData, num){
			if (!klineData || klineData.length<=1) {
				return "0";
			}
			
			//4收盘 2最高 1开盘 3最低
			const last1=klineData.at(-1);
			
			
			//当计算1m涨幅的情况 则直接计算最后一根完成K线的涨幅
			if(num==1){
				const maxPrice=parseFloat(last1[4])
				return (((maxPrice-last1[1])/last1[1])*100).toFixed(2);
				
			//当计算其他时段涨幅，则计算时段内出现过的最低价和最后一根收盘价的涨幅
			}else{
				const nowPrice=parseFloat(last1[4]);
				// 取出指定数量的最新K线，如果数量不足则取全部
				const count = Math.min(num, klineData.length);
				const lastArr = klineData.slice(-count);
				
				// 找出最低价和最高价
				let lowest = Infinity;
				let highest = -Infinity;
				
				lastArr.forEach(kline => {
					const low = parseFloat(kline[3]);  // 最低价
					const high = parseFloat(kline[2]); // 最高价
					
					lowest = Math.min(lowest, low);
					highest = Math.max(highest, high);
				});
				
				// 计算涨幅（百分比），并取整
				if (lowest > 0) {
					// const increase = ((highest - lowest) / lowest) * 100;
					const increase = ((nowPrice - lowest) / lowest) * 100;
					return increase.toFixed(2);
				}
			}
			return "0";
		};

		function calculateBrr(arr, baseValue) {
		    return arr.map(item => {
		        // 计算差值：baseValue - f
		        const diff = baseValue - item.f;
		        
		        // 差值乘以 10000
		        const result =(diff * 10000).toFixed(1);
		        
		        // 格式化结果，正数前面加+号
		        return result >= 0 ? `+${result}` : result;
		    });
		}

				    low:+kline[3],    // 最低价
				    close: +kline[4],  // 收盘价
				    volume: +kline[5], // 成交量
				    closeTime: kline[6],          // 收盘时间
				    quoteVolume: +kline[7], // 成交额
				    trades: +kline[8]
				};
			});
		}
		
		//将筛选结果保存
		function saveRes(filterRes,symbol){
			var symbolX={
				symbol: symbol,
				signal:filterRes.signal,
				detail:filterRes.detail,
				openPrice:filterRes.openPrice,
				spikeTime: (new Date(filterRes.time)).toLocaleString('zh-CN', timeOption),
				id:randID()
			}
			qualifiedSymbols.push(symbolX);
			
			//更新localstorage
			if ($('#local').is(":checked")) {
				var allData=getLocal("Vol1and5");
				let flag=allData.some(a => a.symbol == symbolX.symbol && a.signal == symbolX.signal && a.detail== symbolX.detail)
				if( !flag ){
					allData.push(symbolX);
					setLocal("Vol1and5",allData);
					$("#music2").get(0).play()
				}else{
				}
			}
		}
		
		// 工具函数：解析K线时间戳为可读格式
		function formatKlineTime(timestamp) {
		    return new Date(timestamp).toLocaleString('zh-CN');
		}
		
		// 工具函数：获取K线的基本信息
		function getKlineInfo(kline, index = '') {
		    return {
		        index,
		        time: formatKlineTime(kline[0]),
		        open: parseFloat(kline[1]),
		        high: parseFloat(kline[2]),
		        low: parseFloat(kline[3]),
		        close: parseFloat(kline[4]),
		        volume: parseFloat(kline[5]),
		        quoteVolume: parseFloat(kline[7])
		    };
		}
        
        // 完成分析
        function finishAnalysis() {
			// console.log(111111111)
			// console.log(percentArr)
			
			// 涨幅版排名
			rankAfterCollect(percentArr)
			// 生成信号列表
			if($("#autoChart").prop('checked') ){}
			if(signal_refresh){
				makeSignalTable(redAlertArr)
			}
			
			// makeRankTable(rankArr)
			
            $('#loading').hide();
            isMonitoring = false;
            if (qualifiedSymbols.length > 0) {
                // $('#qualified-count').text(qualifiedSymbols.length);
                // updateStatus(`找到 ${qualifiedSymbols.length} 个符合条件的合约`);
                displayResultsTable();
            } else {
                // $('#no-data').show();
                // updateStatus('未找到符合条件的合约');
            }
            
            updateLastUpdated();
        }
        

		
		function randID() {
		  const randomNum = Math.floor(Math.random() * 100000000);
		  return randomNum.toString().padStart(8, '0');
		}
		function deleteLocal(){
			var selectArr=[];
			$('#tableAll tbody tr').each(function() {
			  // 找到当前行中的复选框
			  var $checkbox = $(this).find('input[type="checkbox"]');
			  if ($checkbox.is(':checked')) {
				  var thisID=$checkbox.parents("tr").data("id")+"";
			    selectArr.push(thisID)
			  } 
			});
			if(selectArr.length>0){
				var localData=getLocal("Vol1and5");
				var newLocalData=reduceArr(localData,selectArr);
				setLocal("Vol1and5",newLocalData);
				makeTable($("#tableAll tbody"),getLocal("Vol1and5").reverse())
			}else{
				alert("空")
			}
		}
		
		function reduceArr(A, B) {
		    // 将数组B转换为Set以提高查找效率
		    const setB = new Set(B);
		    // 使用filter方法创建新数组，只保留x值不在setB中的对象
		    return A.filter(item => !setB.has(item.id));
		}
	
        

        // 更新最后更新时间
        function updateLastUpdated() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString();
            const dateStr = now.toLocaleDateString();
            
            $('#last-updated').text(`${dateStr} ${timeStr}`);
            $('#footer-time').text(`${dateStr} ${timeStr}`);
        }
        

        // 停止监控
        function stopMonitoring() {
            isMonitoring = false;
            updateStatus('监控已停止');
        }
		
		function reduceArr2(A, B) {
		    // 将数组B转换为Set以提高查找效率
		    const setB = new Set(B);
		    // 使用filter方法创建新数组，只保留x值不在setB中的对象
		    return A.filter(item => !setB.has(item.symbol));
		}
		
		//将数组里面symbol值一样的对象成员去重
		function uniqueBySymbol(arr) {
		  const map = new Map();
		  const result = [];
		  
		  for (const item of arr) {
		    if (!map.has(item.symbol)) {
		      map.set(item.symbol, true);
		      result.push(item);
		    }
		  }
		  
		  return result;
		}
