<!DOCTYPE html>
<html lang="zh">
	<head>
		<meta charset="UTF-8">
		<title>Funding Monitor</title>
		<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
		<!-- <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script> -->
		<link rel="stylesheet" href="show.css" />
		<style>
			/* 极细滚动条 */
			::-webkit-scrollbar {
			    width: 4px;
			    height: 4px;
			    background: transparent;
			}
			
			::-webkit-scrollbar-track {
			    background: rgba(0, 0, 0, 0.05);
			}
			
			::-webkit-scrollbar-thumb {
			    background: rgba(80, 80, 80, 0.5);
			    border-radius: 2px;
			}
			
			::-webkit-scrollbar-thumb:hover {
			    background: rgba(120, 120, 120, 0.6);
			}
			body {
				background: #0d1117;
				color: #c9d1d9;
				font-family: Arial;
				margin: 0;
			}

			#topbar {
				padding: 10px 20px;
				background: #161b22;
				border-bottom: 1px solid #30363d;
			}

			.main {
				display: flex;
				/* height: calc(100vh - 50px); */
			}

			.panel {
				flex: 1;
				padding: 0px;
				overflow: auto;
				
			}
			.table-box{
				max-height: 200px;
				overflow-y: scroll;
			}

			.chartPanel {
				flex: 1.2;
				flex: 0.8;
				padding: 0px;
			}

			table {
				border-collapse: collapse;
				width: 100%;
				margin-top: 10px;
			}

			td,
			th {
				border: 1px solid #30363d;
				padding: 1px 2px;
				text-align: right;
				font-size: 10px;
			}

			th {
				background: #161b22;
			}

			.symbol {
				text-align: left;
				/* font-weight: bold; */
				font-size: 12px;
				max-width: 60px;
				overflow: hidden;
			}

			button {
				background: #21262d;
				color: #c9d1d9;
				border: 1px solid #30363d;
				cursor: pointer;
			}

			button:hover {
				background: #30363d;
			}

			.negative {
				color: #ff5c5c;font-size: 12px
			}

			.positive {
				color: #2ecc71;font-size: 12px
			}

			#chart {
				width: 100%;
				height: 228px;
			}

			h3 {
				margin: 0;
			}
			.btn{
				background-color: brown; padding: 2px 4px; border-radius: 5px;margin-left: 10px;
			}
			.chart-box{height: 300px!important;}
			#target{
				    margin-left: 10px;
				    width: 100px;
					    margin-left: 10px;
					    width: 100px;
					    /* font-weight: bold; */
					    background: rgba(255, 255, 255, 0.2);
					    border: none;
					    height: 20px;
					    color: #ff0;
					    font-size: 14px;
					    letter-spacing: 2px;
			}
			#target-btn{
				    background: #bf1b09;
				    border: none;
				    padding: 2px 4px;
				    font-weight: bold;
			}
			.red{ color: red}
			.chart-btn{
				padding: 0;
			}
		</style>
	</head>
	<body>
		<div id="topbar">
			启动：<span id="opentime">-</span> &nbsp;&nbsp;&nbsp;
			刷新：<span id="lastUpdate">-</span> &nbsp;&nbsp;&nbsp;
			<span id="countdown">60</span> 秒
			<input type="text" id="target" name="search" autocomplete="on"><button id="target-btn">set</button>
			<span id="music-lock" class="red">LOCK</span>
			
			<!-- <button class="btn" id="chart1">K线图1</button><button class="btn" id="chart2">K线图2</button> -->
		</div>
		<div class="main">
			<div class="panel">
				<h3>负资金费率最高 <button class="btn" id="chart1">K线图1</button></h3>
				<div class="table-box">
				<table id="table1">
					<thead>
						<tr>
							<th>x</th>
							<th>Symbol</th>
							<th>></th>
							<th>%</th>
							<th>1m</th>
							<th>5m</th>
							<th>15m</th>
							<th>30m</th>
							<th>1h</th>
							<th>2h</th>
							<th>4h</th>
							<!-- <th>12h</th> -->
						</tr>
					</thead>
					<tbody></tbody>
				</table>
				</div>
			</div>
			<div class="panel">
				<h3>5分钟下降最快 <button class="btn" id="chart2">K线图2</button></h3>
				<div class="table-box">
				<table id="table2">
					<thead>
						<tr>
							<th>x</th>
							<th>Symbol</th>
							<th>></th>
							<th>%</th>
							<th>1m</th>
							<th>5m</th>
							<th>10m</th>
							<th>15m</th>
						</tr>
					</thead>
					<tbody></tbody>
				</table>
				</div>
			</div>
			<div class="chartPanel">
				<div id="chart"></div>
			</div>
		</div>
		<audio id="music" src="mp3/fund.mp3"></audio>	
		<div class="chart-container" id="chartContainer"></div>
		<script src="show.js"></script>
		<script>
			//解锁music
			let audioUnlocked = false;
			$(document).one('click keydown touchstart', function () {
				if (audioUnlocked) return;
				// 用无声播放解锁所有音频
				const audios = ['#music', '#music2', '#music30m'];
				audios.forEach(id => {
					const el = $(id)[0];
					if (!el) return;
					const vol = el.volume;
					el.volume = 0;
					el.play().then(() => {
						el.pause();
						el.currentTime = 0;
						el.volume = vol;
					}).catch(() => {});
				});
				audioUnlocked = true;
				// alert('音频已解锁');
				$("#music-lock").removeClass("red").html("OK")
			});
			
			$(document).ready(function() {
				$("#width").prop("checked", false);
				$("#opentime").html(new Date().toLocaleString())
				$('#numK').val(300).change();
				$("#chart1").click(function() {
					console.log(res1)
					startShow2(res1.slice(0, 2), "1m");
				})
				$("#chart2").click(function() {
					console.log(res2)
					startShow2(res2.slice(0, 2), "1m");
				})
				$("#target-btn").click(function(){
					currentChartSymbol=$("#target").val();
					startShow2([currentChartSymbol,"BTCUSDT"],"1m")
				})
			})
			let currentChartSymbol = null;
			
			const historyFunding = {}
			// if(!localStorage.f){
			// 	setLocal("Funding",[])
			// }
			
			
			let res1 = [],
				res2 = [];
			let chart = echarts.init(document.getElementById("chart"));
			const intervalss = {
				"1m": 1,
				"5m": 5,
				"15m": 15,
				"30m": 30,
				"1h": 60,
				"2h": 120,
				"4h": 240,
				// "12h": 720
			}

			function formatPercent(x) {
				return (x * 100).toFixed(4) + "%"
			}

			function calcChange(symbol, current, minutes) {
				const arr = historyFunding[symbol]
				if (!arr) return null
				const target = Date.now() - minutes * 60000
				for (let i = arr.length - 1; i >= 0; i--) {
					if (arr[i].t <= target) {
						return Math.round((current - arr[i].f) * 10000)
					}
				}
				return null
			}
			async function getFunding() {
				const res = await fetch("https://fapi.binance.com/fapi/v1/premiumIndex")
				let data = await res.json()
				const now = Date.now() 
				data= data.filter(item => {
				  return item.symbol.endsWith('USDT') && !item.symbol.startsWith('1000');
				});
				// console.log(data)
				data.forEach(i => {
					const symbol = i.symbol
					const funding = parseFloat(i.lastFundingRate) 
					if (!historyFunding[symbol])
						historyFunding[symbol] = [] 
						historyFunding[symbol].push({
							t: now,
							f: funding
						}) 
						if (historyFunding[symbol].length > 60) 
						historyFunding[symbol].shift()
				}) 
				
				// const historyFunding10=historyFunding.slice(0,10)
				setLocal("Funding",historyFunding);
				// getLocal("Funding")
				
				
				
				renderTable1(data) 
				renderTable2(data) 
				$("#lastUpdate").text(new Date().toLocaleString())
				
				  // ← 加这一行：如果有选中的 symbol，自动刷新资金费率图
				    if (currentChartSymbol) {
				        makeFundChart(currentChartSymbol);
				    }
			}

			function renderTable1(data) {
				res1 = [];
				const list = data.filter(i => parseFloat(i.lastFundingRate) < 0).sort((a, b) => a.lastFundingRate - b.lastFundingRate).slice(0, 20) ;
				const btc = data.find(item => item.symbol === 'BTCUSDT');
				const eth = data.find(item => item.symbol === 'ETHUSDT');
				list.unshift(eth);
				list.unshift(btc);
				const tbody = $("#table1 tbody") 
				tbody.empty() 
				list.forEach(i => {
					const symbol = i.symbol;

					res1.push(symbol)
					const funding = parseFloat(i.lastFundingRate) 
					let row = "<tr>"
					row += `<td><button class="chartBtn" data-symbol="${symbol}">#</button></td>`
					// row += `<td class="symbol">${symbol}</td>`
					row +=`<td class="symbol"><a href="https://www.binance.com/zh-CN/futures/${symbol}" target="_blank">${symbol}</a></td><td><a href="https://www.coinglass.com/tv/zh/Binance_${symbol}" target="_blank">></a></td>`

					row += `<td class="negative">${formatPercent(funding)}</td>`
					for (const k in intervalss) {
						const change = calcChange(symbol, funding, intervalss[k]) 
						if (change === null) {
							row += "<td>-</td>"
						} else {
							const cls = change >= 0 ? "positive" : "negative"
							row += `<td class="${cls}">${change}</td>`
						}
					}
					row += "</tr>"
					tbody.append(row)
				});
				// $('#table1 .chartBtn:first').trigger('click');

			}

			function renderTable2(data) {
				// console.log(data)
				res2 = []
				const arr = data.map(i => {
					const symbol = i.symbol;
					const funding = parseFloat(i.lastFundingRate) 
					const change1m = calcChange(symbol, funding, 1);
					 const change5m = calcChange(symbol, funding, 5) ;
					 const change10m = calcChange(symbol, funding, 10) ;
					 const change15m = calcChange(symbol, funding, 15) 
					return {
						symbol,
						funding,
						change1m,
						change5m,
						change10m,
						change15m
					}
				}).filter(i => i && i.change1m !== null) 
				arr.sort((a, b) => a.change5m - b.change5m) 
				const top = arr.slice(0,20) ;
				// console.log(top);
				if(top.length>1){
					if(top[0].change5m && top[0].change5m<-3){
						if (top[0].change5m && top[0].change5m < -3) {
						    if (audioUnlocked) {
						        const m = $("#music")[0];
						        m.currentTime = 0;
						        m.play().catch(e => console.log('播放失败:', e));
						    }
						}
						// $("#music").get(0).play();
						// $('#table2 .chartBtn:first').trigger('click');
					}
				}
				
				const tbody = $("#table2 tbody") 
				tbody.empty() 
				// const funding = parseFloat(i.lastFundingRate) 
				top.forEach(i => {
					res2.push(i.symbol);
					// const row = ` <tr> <td><button class="chartBtn" data-symbol="${i.symbol}">图</button></td> <td class="symbol">${i.symbol}</td> <td class="negative">${formatPercent(i.f)}</td> <td class="negative">${i.change}</td> </tr> `
					const row =
						` <tr> <td><button class="chartBtn" data-symbol="${i.symbol}">#</button></td> <td class="symbol"><a href="https://www.binance.com/zh-CN/futures/${i.symbol}" target="_blank">${i.symbol}</a></td><td><a href="https://www.coinglass.com/tv/zh/Binance_${i.symbol}" target="_blank">></a></td> <td class="negative">${formatPercent(i.funding)}</td> <td class="negative">${i.change1m}</td><td class="negative">${i.change5m}</td><td class="negative">${i.change10m}</td><td class="negative">${i.change15m}</td> </tr> `
					tbody.append(row)
				})
			}
			$(document).on("click", ".chartBtn", function() {
				// $('#table1 .chartBtn:first').trigger('click');
				console.log(1)
				const symbol = $(this).data("symbol") ;
				 currentChartSymbol = symbol;  // 记录当前选中
				startShow2([symbol,"BTCUSDT"],"1m")
				makeFundChart(symbol)
			}) 
			function makeFundChart(symbol){
				// startShow2([symbol],"1m")
				const arr = historyFunding[symbol] || []
				const last = arr.slice(-120) 
				const times = last.map(i => new Date(i.t).toLocaleTimeString()) 
				const values = last.map(i => i.f * 100) 
				chart.setOption({
					// title: {
					// 	text: symbol,
					// 	textStyle: {
					// 	    color: '#ff0',
					// 	}, 
					// },
					graphic: [{
						type: 'text',
						z: 0,                // 放在最底层
						silent: true,
						left: 'center',
						top: 'top',
						style: {
							text: symbol,
							fill: 'rgba(255,255,255,0.6)',
							fontSize: 25
						}
					}],
					grid: [
						{
							left: '6%',
							right: '2%',
							top: '4%',
							// height: '60%',
							bottom: '0%'
						}
					],
					tooltip: {},
					xAxis: {
						type: "category",
						data: times,
						axisLabel: {
							color: '#fff',
						},
					},
					yAxis: {
						type: "value",
						min: -2, // 固定最小值为 -2%（对应数值 -0.02）
						max: 0.5,  // 固定最大值为 +2%（对应数值 0.02）
						interval: 0.5,
						axisLabel: {
							formatter: '{value}',
							color: '#ff0',
						},
						splitLine: {
							lineStyle: {
								color: '#181A20'
							}
						},
						axisLine: {
							lineStyle: {
								color: '#444'
							}
						},
					},
					series: [{
						type: "bar",
						data: values,
						itemStyle: {
							color: (params) => {
								if (params.value >= 0) return "#2ecc71"
								return "#ff5c5c"
							}
						}
					}]
				})
			}
			window.addEventListener("resize", () => chart.resize()) 
			getFunding() 
			setInterval(getFunding, 60000) 
			let countdown = 60 
			setInterval(() => {
				countdown--
				if (countdown <= 0) countdown = 60 
				$("#countdown").text(countdown)
			}, 1000)
			
			
			function getLocal(key){
				return JSON.parse(localStorage.getItem(key))
			}
			
			function setLocal(key,data){
				localStorage.setItem(key,JSON.stringify(data))
			}
			
			function removeLocal(key){
				localStorage.removeItem(key)
			}
		</script>
	</body>
</html>
