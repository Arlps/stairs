		    // 发起同步AJAX请求[2,7](@ref)
		    $.ajax({
		        url: 'https://fapi.binance.com/fapi/v1/exchangeInfo', // 币安永续合约API地址[5](@ref)

		        success: function(response) {
		            // 成功回调函数内处理数据[1,3](@ref)
		            if (response && response.symbols) {
		                // 筛选永续合约并提取名称[1](@ref)
		                symbolsArray = response.symbols
		                    .filter(symbol => symbol.contractType === 'PERPETUAL') // 过滤永续合约

		            }
		        },
		        error: function(xhr, status, error) {

		            console.error('请求失败:', status, error);
		            alert('获取数据失败，请检查网络连接或API可用性。');
		        }
		    });
		    
		    return symbolsArray; // 返回结果数组[8](@ref)

			    // 先清除可能已存在的定时器
			    if (timer) { clearInterval(timer); }
			    // 设置每秒执行一次的定时器
			    timer = setInterval(function() {
			        if (!isPaused) { // 只有在未暂停时更新倒计时 [6](@ref)
			            downCount--;
			            showTime();
			            // 检查是否倒计时结束

			const range=parseInt($("#aveNum").val()); //console.log(range)

            const total = allSymbols.length;
            const BATCH_SIZE = 10; // 控制并发请求数量

            function processBatch(startIndex) {
                const endIndex = Math.min(startIndex + BATCH_SIZE, total);

                    setTimeout(() => {

                                if (klineData && klineData.length >= limitX) {
                                    // try {
										var priceX=0.01;
										//要求价格大于0.01的合约，同时满足上涨 klineData[lineX][4]>klineData[lineX][1]
										// console.log(symbol,klineData[lineX][1])
										if(klineData[lineX][1]>priceX ){
											// 提取成交量和时间数据
											const volumes = klineData.map(k => parseFloat(k[5])); // 成交量
											const turnovers=klineData.map(k => parseFloat(k[7]));  //成交额
											const times = klineData.map(k => new Date(k[0])); // 时间戳
											// if(symbol=="COAIUSDT"){
											// 	console.log(symbol)
											// 	// console.log(klineData);
											// 	console.log(volumes)
											// }
											
											
											let volumeSpikeFound = false;//确认信号
											let maxRatio = 0;
											let spikeTime = null;
											let currentVolume = 0;
											let previousVolume = 0;
											let currentVol = 0;
											let previousVol=0;
											let deals=0;
											let type=false;
											let priceX=0;
											let minVolume=energy(volumnX);
											
											// 比较最近两根K线的成交量
											if (turnovers.length >= limitX-1) {
												// console.log(volumes)
											 // 遍历数组，找出数组内相邻最大倍数
												for (var i = 0; i < turnovers.length - range; i++) {
													
													var aveVolume=0;
													for(var j=0;j<range;j++){
														aveVolume+=turnovers[i+j]
													}
													// console.log(aveVolume,range)
													aveVolume=aveVolume/range;
													
													// var aveVolume=(volumes[i]+volumes[i+1]+volumes[i+2])/3;
													// console.log(i+range)
													var endPrice=klineData[i+range][4];
													var beginPrice=klineData[i+range][1];
													var priceRatio=(endPrice-beginPrice)/beginPrice;
													
													//判断是否为上涨的交易量 前一根柱子>5K 并且最大交易量大于volumnX //并且涨跌幅>1%
													// console.log(energy(volumnX))
													type=endPrice>beginPrice 
														// && turnovers[i]>5000 
														&& turnovers[i+range]> minVolume  
														// && priceRatio>0.01
													// console.log(volumes[i+range],energy(volumnX))
													// if(volumes[i + 3]==2966751){console.log(volumes[i + 3] /volumes[i])}
													// console.log(volumnX, energy(volumnX))
													if(type){ // 
													
														// 判断后一个元素是否大于前一个元素的5倍
														var thisratio=turnovers[i + range] /aveVolume;
														// console.log(volumes[i + range],aveVolume)
														// console.log(thisratio)
														// console.log(thisratio)
														if(thisratio>maxRatio){
															// console.log(111111111)
															maxRatio=thisratio;
															currentVolume= turnovers[i+range]; // 最新5分钟成交量
															previousVolume = aveVolume;
															spikeTime = times[i + range];
															deals=klineData[i+1][8];
															priceX=endPrice;
														}
														// if(symbol=="COAIUSDT"){console.log(maxRatio)}
													}
													
												}
												// console.log(maxRatio)
												//如果最大倍数大于要求倍数
												if(maxRatio>=ratioX){
													volumeSpikeFound = true;
													
												}
												

											}
											// if(symbol=="COAIUSDT"){console.log(maxRatio)}
											if (volumeSpikeFound) {
											    qualifiedSymbols.push({
											        symbol: symbol,
											        currentPrice:parseFloat(priceX),//parseFloat(klineData[lineX][4]), // 当前价格
											        volumeRatio: maxRatio,
											        currentVolume: parseInt(currentVolume),
											        previousVolume: parseInt(previousVolume),
											        spikeTime: spikeTime,
													deals:deals,
													params:intervalX+"期_"+(limitX-range)+"根_"+range+"均_"+ratioX+"倍_"+volumnX+"量_"
											    });
												// console.log(symbol,maxRatio)
												
												//更新localstorage
												var allData=getLocal("tableDataHour");
												var local_flag=true;
												for (var i = 0; i < allData.length; i++) {
													if(allData[i].symbol==symbol && allData[i].spikeTime==spikeTime.toLocaleString()){
														local_flag=false;
														
													}
												}
												// console.log(qualifiedSymbols)
												if(local_flag){
													
													var member={
														id:randID(),
														symbol: symbol,
														currentPrice:parseFloat(priceX).toFixed(6),//parseFloat(klineData[lineX][4]).toFixed(6), // 当前价格
														volumeRatio: maxRatio.toFixed(2),
														currentVolume: parseInt(currentVolume),
														previousVolume: parseInt(previousVolume),
														spikeTime: spikeTime.toLocaleString(),
														params:intervalX+"期_"+(limitX-range)+"根_"+range+"均_"+ratioX+"倍_"+volumnX+"量_"
													}
													allData.push(member);
													if ($('#local').is(":checked")) {
														setLocal("tableDataHour",allData);
													}
													
													$("#music").get(0).play()
												}
											}
											
											
											
										}else{
											//小于最低价格的币
											// console.log("xxxxxx",i,symbol,klineData[0][1])
										}
                                       
                                    // } 
									// catch (e) {
         //                                console.error(`处理数据时出错 (${symbol}):`, e);
         //                            }
                                }
                                
                                // 更新进度
                                const progress = Math.round((processed / total) * 100);
                                updateProgress(progress, `已分析 ${processed}/${total} 个交易对`);
                                
                                // 所有请求完成
                                if (processed === total) {
                                    finishAnalysis();
                                }
                            },
                            error: function(xhr, status, error) {
                                processed++;
                                // console.error(`获取 ${symbol} 数据失败:`, error);
                                
                                const progress = Math.round((processed / total) * 100);
                                updateProgress(progress, `已分析 ${processed}/${total} 个交易对`);
                                
                                if (processed === total) {
                                    finishAnalysis();
                                }
                            }
                        });
                    }, (i % BATCH_SIZE) * DELAY);
                }
                
                // 处理下一批
                if (endIndex < total) {
                    setTimeout(() => processBatch(endIndex), BATCH_SIZE * DELAY);
                }
            }
            
            // 开始处理第一批
            processBatch(0);
        }
        
        // 完成分析
        function finishAnalysis() {
            $('#loading').hide();
            isMonitoring = false;
            
            if (qualifiedSymbols.length > 0) {
                $('#qualified-count').text(qualifiedSymbols.length);
                updateStatus(`找到 ${qualifiedSymbols.length} 个符合条件的合约`);
                displayResultsTable();
            } else {
                $('#no-data').show();
                updateStatus('未找到符合条件的合约');
            }
            
            updateLastUpdated();
        }
        
        // 显示结果表格
        function displayResultsTable() {
            const tableBody = $('#results-table tbody');
			
            tableBody.empty();
            
            if (qualifiedSymbols.length === 0) {
                $('#no-data').show();
                return;
            }
            
            // 按成交量比率降序排序
            qualifiedSymbols.sort((a, b) => b.volumeRatio - a.volumeRatio);
            
            qualifiedSymbols.forEach((contract, index) => {
                const row = `
                    <tr>
                        <td>
                            <a href="https://www.binance.com/zh-CN/futures/${contract.symbol}" 
                               target="_blank" class="symbol-link">${contract.symbol}</a>
                        </td>
                        <td>${contract.currentPrice.toFixed(6)}</td>
                        <td class="highlight">${contract.volumeRatio.toFixed(2)}倍</td>
                        <td>${energyback(contract.currentVolume)}</td>
                        <td>${energyback(contract.previousVolume)}</td>
                        <td>${contract.spikeTime.toLocaleString()}</td>
						<td>${contract.params}</td>
                    </tr>
                `;
                
				//实时表格更新
                tableBody.append(row);
				
            });
			//显示本次查询结果
            $('#results-table').show();
			
			show_all_data_table($("#tableAll tbody"),"tableDataHour")
			
        }
		
		function show_all_data_table($table,key){
			// console.log(1)
			$table.empty();
			var data=getLocal(key);
			data.reverse();
			
			var html="";
			for (var i = 0; i < data.length; i++) {
				
				var newprice=0;
				
				// console.log(newprice)
				html+='<tr data-id='+data[i].id+'>'+
						'<td><input type="checkbox"></td>'+
						'<td><a href="https://www.binance.com/zh-CN/futures/'+data[i].symbol+'" target="_blank" class="symbol-link">'+data[i].symbol+'</a></td>'+
						'<td class="now">'+newprice+'</td>'+
						'<td class="thatprice">'+data[i].currentPrice+'</td>'+
						'<td class="highlight">'+data[i].volumeRatio+'</td>'+
						'<td>'+energyback(data[i].currentVolume)+'</td>'+
						'<td>'+energyback(data[i].previousVolume)+'</td>'+
						'<td>'+data[i].spikeTime+'</td>'+
						'<td>'+data[i].params+'</td>'+
						"</tr>";
			}
			$table.append(html);
			setTimeout(function(){
				// showNewPrice($table,data)
			},1000)
			
		}
		

		
		//实时展示筛选结果的最新价格
		function showNewPrice($table,data){
			for (var i = 0; i < data.length; i++) {
				const apiUrl = "https://fapi.binance.com/fapi/v1/ticker/price?symbol="+data[i].symbol;
				$.ajax({
					url: apiUrl,
					method: 'GET',
					async: false,
					dataType: 'json',
					success: function(res) {
						var newprice=parseFloat(res.price);
						// console.log(data[i].symbol,newprice)
						var trArr=$table.find("tr");
						var oldprice=parseFloat($(trArr[i]).find(".thatprice").html());//console.log(oldprice);
						var wave=parseInt(((newprice-oldprice)/oldprice)*10000)/100;
						var targetTd=$(trArr[i]).find(".now");
						targetTd.html(wave+"%");
						if(wave>=0){
							targetTd.addClass("green").removeClass("red")
						}else{
							targetTd.addClass("red").removeClass("green")
						}
					}
				});
			}
			
		}
		function getLocal(key){
			return JSON.parse(localStorage.getItem(key))
		}
		
		function setLocal(key,data){
			localStorage.setItem(key,JSON.stringify(data))
		}
		
		function energy(str){
			var num=parseInt(str);
			if (str.indexOf("K")>-1){
				return 1000*num;
			}else if(str.indexOf("M")>-1){
				return 1000000*num;
			}else if(str.indexOf("B")>-1){
				return 1000000000*num;
			}
		}
		function energyback2(num){
			var aaa=num;
			if (typeof value !== 'number') {
			        aaa=Number(aaa);
			    }
			
			if(num/1000000000>=1){
				return parseInt(num/1000000000)+"B";
			}else if(num/1000000>=1){
				return parseInt(num/1000000).toFixed(2)+"M";
			}else if(num/1000>=1){
				return parseInt(num/1000).toFixed(2)+"K"
			}else{
				return num
			}
		}
		function randID() {
		  const randomNum = Math.floor(Math.random() * 100000000);
		  return randomNum.toString().padStart(8, '0');
		}
		function deleteLocal(){
			var selectArr=[];
			$('#tableAll tbody tr').each(function() {
			  // 找到当前行中的复选框
			  var $checkbox = $(this).find('input[type="checkbox"]');
			  if ($checkbox.is(':checked')) {
				 
				  var thisID=$checkbox.parents("tr").data("id")+"";
				   // alert(thisID)
			    selectArr.push(thisID)
			  } 
			});
			if(selectArr.length>0){
				var localData=getLocal("tableDataHour");
				console.log(selectArr)
				var newLocalData=reduceArr(localData,selectArr);
				console.log(newLocalData);
				setLocal("tableDataHour",newLocalData);
				show_all_data_table($("#tableAll tbody"),"tableDataHour")
			}else{
				alert("空")
			}
			// 3 5 6 3   // 5    6
			
		}
		
		function reduceArr(A, B) {
		    // 将数组B转换为Set以提高查找效率
		    const setB = new Set(B);
		    // 使用filter方法创建新数组，只保留x值不在setB中的对象
		    return A.filter(item => !setB.has(item.id));
		}
	
        
        // 更新状态
        function updateStatus(text) {
            $('#status-text').text(text);
        }
        
        // 更新进度
        function updateProgress(percent, text) {
            $('#progress-fill').css('width', percent + '%');
            $('#progress-text').text(text + ` (${percent}%)`);
        }
        
        // 更新最后更新时间
        function updateLastUpdated() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString();
            const dateStr = now.toLocaleDateString();
            
            $('#last-updated').text(`${dateStr} ${timeStr}`);
            $('#footer-time').text(`${dateStr} ${timeStr}`);
        }
        
        // 显示错误信息
        function showError(message) {
            $('#loading').hide();
            $('#error-message').show();
            $('#error-text').text(message);
            updateStatus('发生错误');
            isMonitoring = false;
        }
        
        // 停止监控
        function stopMonitoring() {
            isMonitoring = false;
            updateStatus('监控已停止');
        }
		
		
		
		
		
    </script>
