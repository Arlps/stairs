<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>币安永续合约 实时涨幅 Top20（B/A-1）</title>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
	<link rel="stylesheet" href="show.css" />
<style>
  body { font-family: Consolas, monospace; padding: 5px; background: #0e1116; color: #e6e6e6; display: flex; }
  h3 { margin: 0 0 8px; }
  #tip { color: #888; margin-bottom: 8px; }
  table { border-collapse: collapse; width: 520px; }
  th, td { border: 1px solid #333; padding: 2px 2px; text-align: right; }
  th:nth-child(1), td:nth-child(1) { text-align: left; }
  .up { color: #2ecc71; }
  .down { color: #e74c3c; }
  button { margin-top: 10px; }
  
  .left-box {
    flex: 0 0 auto;             /* 不伸缩，由内容决定宽度 */
    min-width: 460px;           /* 保证列不挤在一起 */
    max-width: 560px;
    overflow-y: auto;
    overflow-x: hidden;
  }
  #res {
    width: 100%;
    border-collapse: collapse;
    font-size: 16px;
    line-height: 1.5;
  }
  .right-box {
    flex: 1 1 0;                /* 自动占满剩余宽度 */
    min-width: 280px;
    height: 100%;
  }
 /* #chartContainer {
    width: 100%;
    height: 100%;
    background: #13161b;
    border-radius: 6px;
    border: 1px solid #2a2f35;
  } */
  
  .chart-box{
	  height: 700px!important;
  }
</style>
</head>
<body>



<div class="left-box">
	<div id="tip">初始化中…</div>
	<table id="res">
  <thead>
    <tr>
      <th>合约</th>
	  <th>abc</th>
      <th>A(24h最低)</th>
      <th>B(最新)</th>
      <th>涨幅</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<button id="btn">立即刷新</button>
</div>
<div class="right-box">
	<div class="chart-container" id="chartContainer"></div>
</div>


	<script src="show.js"></script>
<script>
	
	$(document).ready(function(){
		$('#numK').val(200).change();
		$('#questNum').val(500).change();
		$("#chooseTime").val("1h");
		$("#width").prop("checked",false)
		$("#res").on("click",".openChart",function(){
			const symbol=$(this).data("symbol");
			startShowX([symbol] ,"1h");
			
		})
	})
const TICKER_URL = "https://fapi.binance.com/fapi/v1/ticker/24hr";
const EXCHANGE_URL = "https://fapi.binance.com/fapi/v1/exchangeInfo";

let PERP_SET = null;   // Set<symbol> 永续合约
let BASE_LOW = {};     // { SYMBOL: A }

function isPerp(sym) {
  return PERP_SET ? PERP_SET.has(sym) : true;
}

// 1) 启动：拿永续合约列表 + 基准最低价 A
async function init() {
  $("#tip").text("正在加载交易所信息…");
  try {
    const ex = await $.getJSON(EXCHANGE_URL);
    PERP_SET = new Set(
      ex.symbols
        .filter(x => x.contractType === "PERPETUAL" && x.quoteAsset === "USDT")
        .map(x => x.symbol)
    );
  } catch (e) {
    $("#tip").text("exchangeInfo 失败，退化为全量 USDT 合约：" + e.statusText);
  }

  await loadSnapshot(true);
  setInterval(() => loadSnapshot(false), 60 * 1000);
}

// 2) 拉 24hr ticker
async function loadSnapshot(isInit) {
  $("#tip").text((isInit ? "首次基准已建立，" : "") + "刷新中 " + new Date().toLocaleTimeString());
  try {
    const arr = await $.getJSON(TICKER_URL);
    const rows = [];

    for (const t of arr) {
      if (!/USDT$/.test(t.symbol) || !isPerp(t.symbol)) continue;

      const A = parseFloat(t.lowPrice);
      const B = parseFloat(t.lastPrice);
      if (!(A > 0)) continue;

      if (isInit) {
        BASE_LOW[t.symbol] = A;
        continue; // 初始化那一轮不排榜
      }

      const a0 = BASE_LOW[t.symbol];
      if (!(a0 > 0)) continue;

      const pct = (B - a0) / a0 * 100;
      rows.push({ sym: t.symbol, A: a0, B, pct });
    }

    if (!isInit) {
      rows.sort((x, y) => y.pct - x.pct);
      render(rows.slice(0, 40));
    }
    $("#tip").text("上次更新：" + new Date().toLocaleTimeString());
  } catch (e) {
    $("#tip").text("请求失败：" + e.statusText);
  }
}

function render(list) {
  const html = list.map(r => {
    const cls = r.pct >= 0 ? "up" : "down";
    const sign = r.pct >= 0 ? "+" : "";
    return `<tr>
      <td>${r.sym}</td>
	  <td><a href="javascript:void(0)" class="openChart" data-symbol="${r.sym}">#</a></td>
      <td>${r.A.toFixed(6)}</td>
      <td>${r.B.toFixed(6)}</td>
      <td class="${cls}">${sign}${r.pct.toFixed(2)}%</td>
    </tr>`;
  }).join("");
  $("#tbody").html(html || `<tr><td colspan="4">无数据</td></tr>`);
}

$("#btn").on("click", () => loadSnapshot(false));
$(init);
</script>
</body>
</html>
