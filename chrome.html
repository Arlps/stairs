      "title": "无标题笔记",
      "content": "用JQUERY连接币安Api,使用bootstrap和echart实现下面的功能：\n1.页面没有标题，padding和margin都要很小，以显示更多的内容，分两个大部分\n2.第一部分分成上下两行，上面一行是一个按钮和输入框连接一起，输入框占页面宽度50%，输入永续合约和现货的名称，点击按钮，就可以在第二部分里面显示该币的K线图图表，可以同时输入多个币，用空格分开;\n    同时在输入框下面一行生成这个币的名称的按钮，当这个币的K线图显示的时候，这个按钮对应是高亮状态，当再次点击的时候，该币的图表就不显示，同时按钮变普通状态，鼠标悬浮到按钮上的时候，对应的图表有一个轻微的动画变化。\n    同时按钮的名称和状态会实时存储到localstorage，当下次页面再次打开的时候会显示之前设置的状态，同时第二行可以有一个编辑功能可以删除某一个币的按钮，同时改动到也要实时同步到localstorage;\n    第一行的输入框右边还有另外一个按钮，点击按钮会弹窗显示币安永续合约的24小时涨幅版，显示币的名称和涨幅，点击某个币后就会实现和输入框一样的功能，就是在下面生成该币的按钮和K线图\n3.第二部分是主要展示K线图，每行可以最多显示3个币的K线图，K线图的宽度始终占页面三分之一，K线图里面币的名称点击后会在新页面跳转到该币在币安的交易界面，地址是https://www.binance.com/zh-CN/futures/+币名称，每个K线图的右上角都可以选择1/5/15/30分钟和1/4小时和1天和1周，点击之后该K线图切换成对应时间，K线图可以通过鼠标滚轮水平缩放，但不要显示缩放的功能条，然后每个图最多可以加载200根K线，可以左右移动K线查看过去200根K线，鼠标移到K线上可以悬浮显示该K线的涨幅和开收盘价，币名称的右边要显示该币24小时涨幅，每个K线图都要每分钟刷新一次。\n基本的功能就差不多这样，写出完整的html",

      "title": "无标题笔记",
      "content": "用JQUERY连接币安Api,使用bootstrap和echart实现下面的功能：\n1.页面没有标题，padding和margin都要很小，以显示更多的内容，分两个大部分\n2.第一部分分成上下两行，上面一行是一个按钮和输入框连接一起，输入框占页面宽度50%，输入永续合约和现货的名称，点击按钮，就可以在第二部分里面显示该币的K线图图表，可以同时输入多个币，用空格分开;\n    同时在输入框下面一行生成这个币的名称的按钮，当这个币的K线图显示的时候，这个按钮对应是高亮状态，当再次点击的时候，该币的图表就不显示，同时按钮变普通状态，鼠标悬浮到按钮上的时候，对应的图表有一个轻微的动画变化。\n    同时按钮的名称和状态会实时存储到localstorage，当下次页面再次打开的时候会显示之前设置的状态，同时第二行可以有一个编辑功能可以删除某一个币的按钮，同时改动到也要实时同步到localstorage;\n    第一行的输入框右边还有另外一个按钮，点击按钮会弹窗显示币安永续合约的24小时涨幅版，显示币的名称和涨幅，点击某个币后就会实现和输入框一样的功能，就是在下面生成该币的按钮和K线图\n3.第二部分是主要展示K线图，每行可以最多显示3个币的K线图，K线图的宽度始终占页面三分之一，K线图里面币的名称点击后会在新页面跳转到该币在币安的交易界面，地址是https://www.binance.com/zh-CN/futures/+币名称，每个K线图的右上角都可以选择1/5/15/30分钟和1/4小时和1天和1周，点击之后该K线图切换成对应时间，K线图可以通过鼠标滚轮水平缩放，但不要显示缩放的功能条，然后每个图最多可以加载200根K线，可以左右移动K线查看过去200根K线，鼠标移到K线上可以悬浮显示该K线的涨幅和开收盘价，币名称的右边要显示该币24小时涨幅，每个K线图都要每分钟刷新一次。\n基本的功能就差不多这样，写出完整的html",
